services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # lanes/p1_rag.py builds this chroma index at /app/.p1_textbook_index
      # (relative to the Dockerfile's WORKDIR) and only rebuilds it when the
      # on-disk textbook/ corpus's fingerprint changes -- without a volume
      # here, the container's writable layer (and this index with it) is
      # thrown away on every restart, so every restart paid the full
      # re-index cost again for no reason. This is the fix, not committing
      # the binary chroma database to git: it's fully regenerable from the
      # textbook/ .txt/.md files already in the repo, and git handles a
      # binary sqlite+HNSW blob (diffs badly, bloats the repo on every
      # corpus change) far worse than a plain volume does.
      - textbook_index:/app/.p1_textbook_index
    environment:
      DATABASE_URL: postgresql+psycopg://grading:grading@db:5432/grading
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      CRITIC_MODEL_NAME: ${CRITIC_MODEL_NAME:-}
      CRITIC_TEMPERATURE: ${CRITIC_TEMPERATURE:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grading
      POSTGRES_USER: grading
      POSTGRES_PASSWORD: grading
    volumes:
      - grading_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grading -d grading"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  grading_data:
  textbook_index:
